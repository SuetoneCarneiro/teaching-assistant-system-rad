{% extends 'base.html' %}

{% block title %}Log in{% endblock %}

{% block content %}
  {# TODO(Pedro): styled auth card. This is a placeholder. #}
  <h1>Log in</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
{% endblock %}
